version: "3.8"

services:
  redis:
    image: redis:7-alpine
    container_name: newsdrop-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

  newsdrop:
    build: .
    container_name: newsdrop-bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - newsdrop_data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_PATH=/app/data/bot_data.db
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
    depends_on:
      - redis
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"

volumes:
  redis_data:
  newsdrop_data:
